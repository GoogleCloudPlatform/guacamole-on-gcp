# HorizontalPodAutoscaler scaling guacamole-server (guacd) Pods based on both
# Memory utilization (tracks forked child processes per active session) and
# CPU utilization (tracks active RDP/VNC graphical encoding bursts).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guacamole-server-hpa
  namespace: guacamole
  labels:
    app: guacamole-server
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guacamole-server
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Tracks active session count (~50-150 MiB per forked guacd connection process).
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
    # Tracks active graphical encoding bursts (RDP/VNC screen updates).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    # Scale out immediately when session count or rendering CPU spikes.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    # Scale in conservatively (30-minute window, max 1 Pod per 5 minutes);
    # the Pod preStop hook drains any remaining active sessions before termination.
    scaleDown:
      stabilizationWindowSeconds: 1800
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
