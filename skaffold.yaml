# Skaffold configuration for building guacamole-client-iap and deploying all Kustomize manifests.
apiVersion: skaffold/v4beta5
kind: Config
build:
  # Target linux/amd64 explicitly so builds on Apple Silicon (arm64) workstations run on x86_64 GKE Autopilot nodes.
  platforms:
    - "linux/amd64"
  artifacts:
    - image: guacamole-client-iap
      context: ./client
      docker:
        buildArgs:
          CLIENT_IMAGE: guacamole/guacamole:1.6.0
# Render Kubernetes manifests and ConfigMaps/Secrets from the root Kustomization.
manifests:
  kustomize:
    paths:
      - .
# Apply rendered manifests to the active GKE cluster context via kubectl.
deploy:
  kubectl: {}
# Optional Cloud Build profile for building and pushing images remotely in Google Cloud.
profiles:
  - name: cloudbuild
    build:
      googleCloudBuild: {}
