# GKE BackendConfig configuring Load Balancer health checks, WebSocket timeout, and Google Cloud IAP.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: guacamole-config-default
  namespace: guacamole
spec:
  # Probe /index.html on Tomcat port 8080 so the Load Balancer verifies web app readiness.
  healthCheck:
    checkIntervalSec: 15
    port: 8080
    type: HTTP
    requestPath: /index.html
  # Keep the HTTP(S) Load Balancer connection open for up to 2 hours for active Guacamole WebSockets.
  timeoutSec: 7200
  # Enable Google Cloud Identity-Aware Proxy on the Load Balancer BackendService without an OAuth secret.
  iap:
    enabled: true